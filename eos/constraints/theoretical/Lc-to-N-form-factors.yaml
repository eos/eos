# vim: set fdm=marker :

# Lattice-QCD results of [M:2017A] (arXiv:1712.05783) for the Lambda_c -> N
# (N = n, p) vector, axialvector, tensor and axialtensor form factors.
#
# The calculation is carried out in the isospin limit m_u = m_d, in which
#   <n| dbar Gamma c |Lambda_c> = <p| ubar Gamma c |Lambda_c>
# holds exactly, cf. sec. I of [M:2017A]. The Lambda_c -> n and Lambda_c -> p
# form factors are therefore described by one and the same set of numbers below.
# The same absolute values of q2 are used for the Lambda_c -> n and the
# Lambda_c -> p constraints; all of them lie well inside the physical region of either channel.

