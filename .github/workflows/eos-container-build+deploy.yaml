on:
  workflow_dispatch:
    inputs:
      eosversion:
        description: EOS version to install
        required: true
        type: string
      image_tag:
        description: Image tag suffix identifying the source
        required: true
        type: string
      update_latest:
        description: Update the latest image tag
        required: true
        default: false
        type: boolean

name: Build and Deploy Docker container for EOS analyses

concurrency:
  group: eos-container
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & deploy ``eoshep/eos`` images
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, arch: x86_64, tag_prefix: amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, arch: aarch64, tag_prefix: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    env:
      EOSVERSION: ${{ inputs.eosversion }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Checkout git repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Wait for ``eoshep==${EOSVERSION}`` to become available on PyPI
        # Allow for a short delay since we are triggering this directly after a PyPI upload
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -sf "https://pypi.org/pypi/eoshep/${EOSVERSION}/json" > /dev/null; then
              exit 0
            fi
            sleep 60
          done
          exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the ``eoshep/eos`` image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .github/Dockerfiles
          file: .github/Dockerfiles/eos.dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            EOSVERSION=${{ env.EOSVERSION }}
          push: true
          outputs: type=image,name=eoshep/eos,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-platform manifest
        working-directory: /tmp/digests
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          tags=(-t "eoshep/eos:${IMAGE_TAG}")
          if [[ "${UPDATE_LATEST}" == "true" ]]; then
            tags+=(-t "eoshep/eos:latest")
          fi

          docker buildx imagetools create \
            "${tags[@]}" \
            $(printf 'eoshep/eos@sha256:%s ' *)

      - name: Inspect multi-platform manifest
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: docker buildx imagetools inspect "eoshep/eos:${IMAGE_TAG}"
