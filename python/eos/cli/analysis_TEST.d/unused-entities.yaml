likelihoods:
  - name: lattice
    constraints:
      - B->pi::f_++f_0@RBC+UKQCD:2015A
  - name: unused-likelihood
    constraints:
      - B->pi::f_+@KMO:2006A

priors:
  - name: FF
    descriptions:
      - parameter: B->pi::f_+(0)@BCL2008
        min: 0.15
        max: 0.30
        type: uniform
  - name: unused-prior
    descriptions:
      - parameter: B->pi::b_+^1@BCL2008
        min: -4
        max: +4
        type: uniform

posteriors:
  - name: FF
    likelihood:
      - lattice
    prior:
      - FF
