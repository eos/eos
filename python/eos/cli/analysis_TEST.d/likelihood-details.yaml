likelihoods:
  - name: builtin
    constraints:
      - B->pi::f_+@KMO:2006A
  - name: manual
    manual_constraints:
      'test::manual-constraint':
        type: 'Gaussian'
        observable: 'B->pi::f_+(q2)'
        kinematics: { 'q2': 0.0 }
        mean: 0.28
        sigma-stat: { hi: 0.03, lo: 0.03 }
        sigma-sys: { hi: 0.0, lo: 0.0 }
        dof: 1
  - name: with-pyhf
    constraints:
      - B->pi::f_+@KMO:2006A
    pyhf:
      file: 'workspace.json'

priors:
  - name: FF-norm
    parameters:
      - parameter: B->pi::f_+(0)@BCL2008
        min: 0.15
        max: 0.30
        type: uniform

posteriors:
  - name: FF
    likelihood: [ builtin, manual, with-pyhf ]
    prior: [ FF-norm ]
