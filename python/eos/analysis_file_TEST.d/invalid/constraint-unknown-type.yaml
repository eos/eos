format_version: 2

# A constraint declaration with an unrecognized 'type'; only 'external' is currently supported.

constraints:
  - name: 'test::bad-constraint-type@Test:2026A'
    type: bogus
    filename: 'constraints/bad-constraint-type/constraint.yaml'

priors:
  - name: prior
    descriptions:
      - { parameter: 'mass::e', type: uniform, min: 0.0, max: 1.0 }

likelihoods:
  - name: likelihood
    constraints:
      - 'B->D::f_++f_0@HPQCD:2015A'

posteriors:
  - name: posterior
    prior: [ prior ]
    likelihood: [ likelihood ]
