priors:
  - name: dummy-prior
    descriptions:
      - { 'parameter': 'mass::b(MSbar)', 'min': 4.0, 'max': 4.4, 'type': 'uniform' }

likelihoods:
  - name: unbinned-test
    type: 'unbinned'
    pdf: 'TestLegendre1D::P(z)'
    data: './unbinned-data'
    windows:
      # native axis is [0.0, 3.0]; the event at z = 1.5 lies outside both windows
      - [ { variable: 'z', min: 0.0, max: 1.0 } ]
      - [ { variable: 'z', min: 2.0, max: 3.0 } ]

posteriors:
  - name: posterior
    prior:
      - dummy-prior
    likelihood:
      - unbinned-test
