format_version: 2

# A minimal, self-contained analysis file exercising AnalysisFile._load_declared_constraints() and
# the corresponding 'has not been produced yet' WARNING in AnalysisFile.validate(). Unlike
# declared-external-constraint.yaml (Step 1's own regression fixture, which uses a real, more
# complex EOS constraint in its likelihood), this fixture's likelihood is a trivial manual
# constraint so that building the full eos.Analysis for 'posterior' does not depend on anything
# outside this file.

constraints:
  - name: 'test::loader-declared-constraint@Test:2026A'
    type: external
    filename: 'constraints/loader-declared-constraint/constraint.yaml'

priors:
  - name: constrained-prior
    descriptions:
      - { type: constraint, constraint: 'test::loader-declared-constraint@Test:2026A' }

likelihoods:
  - name: likelihood
    manual_constraints:
      test::loader-manual-constraint@Test:2026A:
        type: Gaussian
        observable: mass::b(MSbar)
        kinematics: {}
        options: {}
        mean: 4.18
        sigma-stat: {hi: 0.03, lo: -0.03}
        sigma-sys: {hi: 0.0, lo: 0.0}

posteriors:
  - name: posterior
    prior: [ constrained-prior ]
    likelihood: [ likelihood ]
