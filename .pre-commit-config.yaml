repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.2
    hooks:
      - id: clang-format
        types_or: ['c++']
        exclude: ^(eos/b-decays/|eos/c-decays/|eos/form-factors/|eos/nonlocal-form-factors/|eos/rare-b-decays/|eos/scattering/)

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy (report only)
        description: Report outdated C++ idioms. Does not rewrite any file.
        language: python
        additional_dependencies: ['clang-tidy==21.1.1']
        # compile_flags.txt is written by configure. Without it clang-tidy has no
        # include paths and every file fails to parse, so skip instead.
        entry: bash -c 'test -f compile_flags.txt || { echo "clang-tidy hook skipped, the source tree is not configured (run ./configure)." ; exit 0 ; } ; exec clang-tidy --quiet --warnings-as-errors="*" "$@"' --
        types_or: ['c++']
        # Only eos/utils/ has been modernised so far. Drop a directory from this
        # list once its findings have been addressed.
        exclude: '^(python/|src/|test/|eos/[^/]+\.(cc|hh)$|eos/(b-decays|c-decays|constraints|form-factors|maths|meson-mixing|models|nonleptonic-amplitudes|nonlocal-form-factors|parameters|rare-b-decays|rare-c-decays|s-decays|scattering|statistics|tau-decays)/)'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-ast
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: forbid-submodules

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        name: prettier (infrastructure YAML)
        files: ^(\.github/.*\.(yaml|yml)|[^/]+\.yaml)$

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.20.0
    hooks:
      - id: pyupgrade
        args: [--py39-plus]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/eos/pre-commit-hooks
    rev: b5c3b192c7f406ea9391069fc65bd634089dbbd0
    hooks:
      - id: eos-test-check-argument-order
        exclude: '^test/test_TEST.cc$'
      - id: eos-test-ordereddict-usage
        exclude: '^src/scripts/eos-make-constraint'
      - id: eos-test-check-references
        additional_dependencies: ['pyyaml']
      - id: eos-constraints-format
        files: ^eos/constraints/.*\.yaml$

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.35
    hooks:
      - id: pymarkdown
